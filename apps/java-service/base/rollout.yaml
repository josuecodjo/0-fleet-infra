apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: java-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: java-service
  template:
    metadata:
      labels:
        app: java-service
    spec:
      # securityContext:
      #   runAsNonRoot: true
      #   runAsUser: 1000
      containers:
        - name: java-service
          image: public.ecr.aws/nginx/nginx:1.24 ## 1.24
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
          # --- LIVENESS PROBE ---
          # Checks if the container is deadlocked. If it fails 3 times, Kubernetes restarts it.
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30 # Give the JVM time to spin up
            periodSeconds: 15 # Check every 15 seconds
            timeoutSeconds: 3 # Must respond within 3 seconds
            failureThreshold: 3 # Restart after 3 consecutive failures

          # --- READINESS PROBE ---
          # Checks if the app is ready for traffic. Argo Rollouts waits for this.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10 # Check more frequently than liveness
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1 # Needs 1 success to be marked Ready
      volumes:
        - name: content
          configMap:
            name: java-content

  strategy:
    blueGreen:
      # Service for production traffic
      activeService: java-service-active
      # Service for testing new version before promotion
      previewService: java-service-preview
      previewReplicaCount: 1
      # Automatically promote after successful analysis
      autoPromotionEnabled: true # Keptn
      # Wait for analysis before auto-promotion
      autoPromotionSeconds: 30
      # Scale down old version after this delay
      scaleDownDelaySeconds: 30
      # Run analysis before promotion
      prePromotionAnalysis:
        templates:
          - templateName: web-analysis
        args:
          - name: url
      # Run analysis after promotion
      postPromotionAnalysis:
        templates:
          - templateName: web-analysis
        args:
          - name: url
